spring.application.name=Assignment-service

server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/assignmentdb
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# RabbitMQ
spring.rabbitmq.port=5672
spring.rabbitmq.host=localhost
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbit.exchange=claim.exchange
rabbit.queue.assignment=claim_assignment_queue
rabbit.routing.assignment=claim.assignment



jwt.secret=ReplaceWithASecureLongRandomStringAtLeast32CharsLong
