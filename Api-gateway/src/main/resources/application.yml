server:
  port: 9999

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: claim-service
          uri: http://localhost:8081
          predicates:
            - Path=/claims/**
          filters:
          - StripPrefix=1

        - id: Assignment-service
          uri: http://localhost:8082
          predicates:
             - Path=/assign/**

        - id: Approver-service
          uri: http://localhost:8083
          predicates:
            - Path=/approval/**


logging:
  level:
        org.springframework.cloud.gateway: DEBUG				
